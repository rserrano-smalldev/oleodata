name: oleodata

services:
  db:
    build:
      context: ./db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oleodata}
      POSTGRES_USER: ${POSTGRES_USER:-oleodata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oleodata_dev_password}
    ports:
      - "${DB_PORT:-5480}:5432"
    volumes:
      - oleodata_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oleodata} -d ${POSTGRES_DB:-oleodata}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://oleodata:oleodata_dev_password@db:5432/oleodata}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme_admin_password}
      OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
      OPEN_METEO_ELEVATION_URL: ${OPEN_METEO_ELEVATION_URL:-https://api.open-meteo.com/v1/elevation}
    ports:
      - "${API_PORT:-8420}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "${FRONTEND_PORT:-5180}:5000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  oleodata_pgdata:
    name: oleodata_pgdata
